services:
  - type: web
    name: silentradar
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: ACOUSTIC_HOST
        value: 127.0.0.1
      - key: ACOUSTIC_PORT
        value: '50051'
      - key: GRPC_TARGET
        value: 127.0.0.1:50051
      - key: TRUST_PROXY_HOPS
        value: '1'
